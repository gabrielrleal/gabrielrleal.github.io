<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b14">
  <title>Arcana — Jogos para TV</title>
  <link rel="stylesheet" href="./launcher.css">
</head>
<body>
  <main id="launcher" class="launcher">
    <header class="launcher__header">
      <div>
        <p class="eyebrow">Central de jogos</p>
        <h1>Arcana</h1>
      </div>
      <button id="fullscreen-button" class="icon-button" type="button" aria-label="Tela cheia">⛶</button>
    </header>

    <section id="game-grid" class="game-grid" aria-label="Jogos disponíveis"></section>
  </main>

  <section id="game-stage" class="game-stage hidden" aria-label="Jogo selecionado">
    <iframe id="game-frame" title="Jogo selecionado" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </section>

  <script src="./launcher.js" defer></script>
</body>
</html>
